name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: npm test
        run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image copies the build context; this catches a file that was added
      # to the repo but never shipped (db.js was missing once).
      - run: docker build -t koe:ci .
      - name: every runtime module is in the image
        run: |
          docker run --rm koe:ci node -e "
            for (const m of ['express','./guard','./db','./stats','./audio','./voices','./hosted-mcp','./engines','./engines/backend']) {
              require(m);
            }
            for (const f of ['server.js','index.html','mcp.html','stats.html','hosted-mcp.js','db.js','guard.js','stats.js','voices.js','audio.js']) {
              require('fs').accessSync(f);
            }
            require('fs').accessSync('assets/logo-mark.png');
            console.log('image contents ok');
          "
