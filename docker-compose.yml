# ─────────────────────────────────────────────────────────────
#  Koe TTS Studio — Kokoro sidecar
#
#  Optional. The studio runs perfectly well without this file: edge and piper
#  are unaffected, and only `engine: "kokoro"` requests are rejected (503
#  {"error":"tts_unavailable"}) when the sidecar is down.
#
#    docker compose up -d      start the sidecar
#    docker compose down       stop it
#    docker compose logs -f    watch it warm up
#
#  The studio reaches it at KOKORO_BASE_URL (default http://127.0.0.1:8880).
#  The port is bound to loopback only — it is never exposed to the network.
#
#  Pinned by digest: never `:latest`. Bump both the tag and the digest
#  together when upgrading.
# ─────────────────────────────────────────────────────────────

services:
  kokoro:
    # msgflux/fastkokoro 0.7 — OpenAI-compatible Kokoro-82M server (ONNX Runtime).
    # tag: 0.7-cpu   digest: manifest list, published 2026-07-22
    image: msgflux/fastkokoro:0.7-cpu@sha256:35b4282aeefd793282a7daaf3c9cb923d59d1cd6a742a1c69317627e878954fc

    container_name: koe-kokoro
    restart: unless-stopped

    # The sidecar is the only thing in this stack that does real work, so it
    # gets a hard ceiling. Default 1 GB, not 2: on the 2 GB t3.small the app
    # container needs the other half, and a 2 GB sidecar limit would let the
    # host OOM-kill Node before Docker ever enforced it. Override per host with
    # KOKORO_MEM_LIMIT (e.g. 2g on a 4 GB box) — never raise it on 2 GB.
    #
    # Do not start this on a 1 GB host (t3.micro) at all: the first-boot ONNX
    # rewrite needs more than 1 GB and takes the whole instance down. See
    # DEPLOY.md §8 for the sizing table.
    cpus: "2.0"
    mem_limit: ${KOKORO_MEM_LIMIT:-1g}

    ports:
      # Loopback only — the studio is the sole intended client.
      - "127.0.0.1:8880:8880"

    environment:
      FASTKOKORO_HOST: 0.0.0.0
      FASTKOKORO_PORT: "8880"
      FASTKOKORO_ONNX_PROVIDERS: CPUExecutionProvider
      # Startup runs a warmup synthesis (image default), so give the
      # healthcheck room before declaring failure.
      FASTKOKORO_WARMUP: "true"

    volumes:
      # The image sets FASTKOKORO_CACHE_DIR=/models; keeping it a named volume
      # means the ~160 MB checkpoint downloads once instead of on every restart.
      - kokoro-models:/models

    healthcheck:
      # No curl in python:3.12-slim, so probe with the interpreter itself.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=4)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # First boot downloads the model and warms up.
      start_period: 180s

  kitten:
    # Kitten TTS through ops/kitten/server.py — a stdlib HTTP wrapper around the
    # 15M–80M ONNX models. Build it from this repo: there is no pinned upstream
    # image, and the wrapper is part of the deployment.
    build:
      context: ./ops/kitten
    image: koe-kitten:local

    container_name: koe-kitten
    restart: unless-stopped

    # Much cheaper than Kokoro: 512 MB is plenty for the int8 nano model plus
    # onnxruntime, with the synthesis lock keeping it to one job at a time.
    # Override with KITTEN_MEM_LIMIT. Never run this AND kokoro on a 2 GB host:
    # 1g + 512m + the app does not fit.
    cpus: "1.0"
    mem_limit: ${KITTEN_MEM_LIMIT:-512m}

    ports:
      - "127.0.0.1:8881:8881"

    environment:
      KITTEN_MODEL: ${KITTEN_MODEL:-KittenML/kitten-tts-nano-0.8-int8}
      KITTEN_PORT: "8881"
      HF_HOME: /models

    volumes:
      # The weights download once; later restarts reuse the volume.
      - kitten-models:/models

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8881/health', timeout=4)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  kokoro-models:
  kitten-models:
