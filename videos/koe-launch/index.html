      @font-face {

        font-weight: 200 900;
        font-style: normal;
        font-display: block;

      @font-face {

      :root {
        /* rebrandable */
        --color-ground: #f2f0e9;
        --color-ink: #181613;
        --color-accent: #b23a2b;
        --font-display: "Source Serif 4";

        /* the rest of the Koe paper world (DESIGN.md) */
        --sheet: #fbfaf5;
        --ink-2: #3b372f;
        --muted: #6d675c;
        --line: #d8d2c4;
        --line-strong: #c3baa8;
        --oxide-ink: #8d2b1f;
        --oxide-soft: #f3e2dc;
        --healthy: #2f6b4f;
        --font-body: "IBM Plex Sans", sans-serif;
        --font-mono: "DM Mono", monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
