  <script>
    const tl = gsap.timeline({ paused: true });

    // Each group opens with a soft cut and is hard-killed at its window's end,
    // so no stale line can linger over the next beat.
    const groups = [
      { id: "#c3", at: 6.15, end: 8.85 },
      { id: "#c6", at: 17.65, end: 23.3 },
      { id: "#c8", at: 29.25, end: 33.9 },
    ];

    for (const g of groups) {
      tl.fromTo(g.id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.16, ease: "power2.out" }, g.at);
      tl.to(g.id, { opacity: 0, duration: 0.12, ease: "power2.in" }, Math.max(g.at + 0.16, g.end - 0.12));
      tl.set(g.id, { visibility: "hidden" }, g.end);
    }

    window.__timelines["captions"] = tl;
